name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets are required: the app binds to the runner-dashboard-db D1 database in your Cloudflare account, which temporary preview deploys cannot access. Add both under Settings -> Secrets and variables -> Actions (token permissions: Workers Scripts - Edit, D1 - Edit)."
            exit 1
          fi
          npx wrangler deploy 2>&1 | tee deploy-output.txt

          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy-output.txt | head -1)
          if [ -n "$URL" ]; then
            echo "Deployed to: $URL"
            for i in 1 2 3 4 5; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
              echo "Smoke test attempt $i: HTTP $STATUS"
              [ "$STATUS" = "200" ] && break
              sleep 5
            done
            [ "$STATUS" = "200" ]
          fi
